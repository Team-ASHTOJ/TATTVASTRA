name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts-api-dashboard:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: jocky
          POSTGRES_DB: jocky
          POSTGRES_PASSWORD: ci-test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jocky" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.16"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: make bootstrap verify-foundation
      - run: .venv/bin/python scripts/test_postgres.py
        env:
          JOCKY_TEST_DATABASE_URL: postgresql+psycopg://jocky:ci-test-only-password@127.0.0.1:5432/jocky
      - run: PLAYWRIGHT_BROWSERS_PATH=.cache/playwright npx playwright install --with-deps chromium
      - run: make test-e2e
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make verify-native-container
  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make verify-agent-container
  windows-agent:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: choco install protoc --no-progress -y
      - run: rustup toolchain install 1.90.0 --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/configure_local.py
      - run: make infra-check
