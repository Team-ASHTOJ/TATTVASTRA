[project]
name = "jocky-control-plane"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "jocky-contracts", "fastapi>=0.120,<1", "uvicorn[standard]>=0.38,<1",
  "pydantic-settings>=2.11,<3", "sqlalchemy>=2.0.44,<3", "alembic>=1.17,<2",
  "psycopg[binary]>=3.2,<4", "redis>=7,<8", "networkx>=3.5,<4",
  "grpcio>=1.75,<2", "protobuf>=6.33,<8", "boto3>=1.40,<2",
  "cryptography>=46,<50", "prometheus-client>=0.23,<1",
  "opentelemetry-api>=1.38,<2", "opentelemetry-sdk>=1.38,<2",
]

[tool.uv.sources]
jocky-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jocky_control_plane"]
