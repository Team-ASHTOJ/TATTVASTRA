syntax = "proto3";
package jocky.v1;

// Enrollment runs on a TLS listener; Exchange requires an enrolled mTLS identity.
service AgentControl {
  rpc Enroll(EnrollmentRequest) returns (EnrollmentResponse);
  rpc Exchange(stream AgentFrame) returns (stream ControlFrame);
  // mTLS only; bytes are restricted to this endpoint's active assigned job.
  rpc FetchJobArtifact(JobArtifactRequest) returns (stream ArtifactChunk);
}

message JobArtifactRequest {
  string job_id = 1;
}

message ArtifactChunk {
  string content_hash = 1;
  uint64 size_bytes = 2;
  uint64 offset = 3;
  bytes content = 4;
}

message CanonicalDocument {
  // UTF-8 schema-normalized RFC 8785 JSON. Validate schema_version and schema
  // before trust. This preserves identical signed bytes across protobuf runtimes.
  bytes json_utf8 = 1;
}

message EnrollmentRequest {
  string schema_version = 1;
  string one_time_token = 2;
  bytes certificate_signing_request_pem = 3;
  string agent_version = 4;
  string target_os = 5;
  string target_arch = 6;
  optional bool simulation = 7;
  string hostname = 8;
  repeated string execution_modes = 9;
  bytes evidence_public_key = 10;
  // Ed25519 signature over "JOCKY:enroll:v1\n" + exact CSR PEM bytes.
  bytes evidence_key_proof = 11;
}

message EnrollmentResponse {
  string endpoint_id = 1;
  bytes certificate_chain_pem = 2;
  bytes trust_bundle_pem = 3;
  string expires_at = 4;
  string organization_id = 5;
  bytes job_authority_public_key = 6;
}

message Heartbeat {
  string timestamp = 1;
  string state = 2;
  optional double cpu_percent = 3;
  optional uint64 memory_bytes = 4;
  string active_job_id = 5;
}

message AgentFrame {
  string schema_version = 1;
  string endpoint_id = 2;
  uint64 sequence = 3;
  // Presence is required by application validation. Unset never means REAL.
  optional bool simulation = 4;
  oneof body {
    Heartbeat heartbeat = 10;
    CanonicalDocument observation = 11;
    CanonicalDocument evidence_manifest = 12;
    CanonicalDocument job_progress = 13;
    CanonicalDocument artifact = 14;
  }
}

message Acknowledgement {
  uint64 accepted_sequence = 1;
  string receipt_id = 2;
}

message ControlFrame {
  string schema_version = 1;
  oneof body {
    CanonicalDocument signed_job = 10;
    CanonicalDocument signed_cancellation = 11;
    Acknowledgement acknowledgement = 12;
  }
}
