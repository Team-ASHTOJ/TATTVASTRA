[project]
name = "jocky-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["jocky-contracts", "jocky-control-plane"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/contracts", "services/control-plane"]

[tool.uv.sources]
jocky-contracts = { workspace = true }
jocky-control-plane = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=9,<10", "httpx>=0.28,<1", "ruff>=0.14,<1",
  "mypy>=1.18,<2", "build>=1.3,<2", "jsonschema>=4.25,<5",
  "types-jsonschema>=4.25", "grpcio-tools>=1.75,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests/integration", "packages/contracts/tests", "services/control-plane/tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache", ".tools", "build", "generated", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/contracts/src", "services/control-plane/src"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
